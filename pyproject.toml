[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multimodalpy"
version = "0.1.1"
description = "Easy creation of multimodal transport networks"
readme = "README.md"


requires-python = ">=3.11"

license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Aida Villalba Ortiz", email = "aivilor@upv.es" },

]
keywords = ["multimodal", "networks", "transport"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=1.26",
  "networkx",
  "geopandas",
  "osmnx",
  "pandas",
  "requests",
  "shapely",
  "pooch>=1.8",
]




# Uncomment if your package ships a command-line tool:
# [project.scripts]
# your-command = "your_package_name.cli:main"

[project.urls]
Homepage = "https://github.com/aivilor/multimodalpy"
Documentation = "https://multimodalpy.readthedocs.io"
Repository = "https://github.com/aivilor/multimodalpy"
Issues = "https://github.com/aivilor/multimodalpy/issues"
Changelog = "https://github.com/aivilor/multimodalpy/blob/main/CHANGELOG.md"


[dependency-groups]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme",
  "myst-parser",
  # Or, if you prefer MkDocs: "mkdocs-material", "mkdocstrings[python]"
]
lint = [
  "ruff",
  "mypy",
]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]

packages = ["src/multimodalpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=multimodalpy --cov-report=term-missing"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]

select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]  

[tool.ruff.lint.pydocstyle]
convention = "numpy"  

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true